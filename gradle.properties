# Keep the Gradle and Kotlin compiler JVMs inside constrained containers (1.6 GiB cgroup here).
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=96m -Dfile.encoding=UTF-8 -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.enableBuildConfigAsBytecode=true
# AGP 9 enables built-in Kotlin with its bundled Kotlin version. Keep using the
# Kotlin Android plugin until the project migrates to built-in Kotlin.
android.builtInKotlin=false
android.newDsl=false
