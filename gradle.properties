org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options="-Xmx4G"
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
android.enableBuildConfigAsBytecode=true
# AGP 9 enables built-in Kotlin with its bundled Kotlin version. Keep using the
# Kotlin Android plugin until the project migrates to built-in Kotlin.
android.builtInKotlin=false
android.newDsl=false
