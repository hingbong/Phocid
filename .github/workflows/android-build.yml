name: Android Build

on:
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: Run JVM unit tests
        required: false
        type: boolean
        default: false
  push:
    branches:
      - fix/battery-background-ui

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare signing keystore
        env:
          PHOCID_KEYSTORE_BASE64: ${{ secrets.PHOCID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${PHOCID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$PHOCID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/phocid-signing.p12"
            echo "PHOCID_KEYSTORE_PATH=$RUNNER_TEMP/phocid-signing.p12" >> "$GITHUB_ENV"
            echo "Using stable signing keystore from PHOCID_KEYSTORE_BASE64"
          else
            echo "PHOCID_KEYSTORE_BASE64 is not set; AGP will generate a per-run debug keystore."
          fi

      - name: Build release APK
        env:
          PHOCID_KEYSTORE_PASSWORD: ${{ secrets.PHOCID_KEYSTORE_PASSWORD }}
          PHOCID_KEY_ALIAS: ${{ secrets.PHOCID_KEY_ALIAS }}
          PHOCID_KEY_PASSWORD: ${{ secrets.PHOCID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "=== $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Run unit tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_unit_tests }}
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: phocid-next-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
