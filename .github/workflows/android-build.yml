name: Android Build

on:
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: Run JVM unit tests
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare signing keystore
        env:
          PHOCID_KEYSTORE_BASE64: ${{ secrets.PHOCID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${PHOCID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$PHOCID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/phocid-signing.p12"
            echo "PHOCID_KEYSTORE_PATH=$RUNNER_TEMP/phocid-signing.p12" >> "$GITHUB_ENV"
            echo "Using stable signing keystore from PHOCID_KEYSTORE_BASE64"
          else
            echo "PHOCID_KEYSTORE_BASE64 is not set; AGP will generate a per-run debug keystore."
          fi

      - name: Run unit tests
        env:
          PHOCID_KEYSTORE_PASSWORD: ${{ secrets.PHOCID_KEYSTORE_PASSWORD }}
          PHOCID_KEY_ALIAS: ${{ secrets.PHOCID_KEY_ALIAS }}
          PHOCID_KEY_PASSWORD: ${{ secrets.PHOCID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain :app:customSetup :app:testReleaseUnitTest 2>&1 | tee "$RUNNER_TEMP/unit-test.log"
          status=${PIPESTATUS[0]}
          exit $status

      - name: Report unit test failures
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/unit-test.log" ]; then
            grep -nE "(^e: | error: |FAILED|> Task .* FAILED|AssertionError|expected:|but was:)" "$RUNNER_TEMP/unit-test.log" | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -n -A16 -B2 -E "What went wrong|Could not resolve|Failed to apply plugin|requires Gradle" "$RUNNER_TEMP/unit-test.log" | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "--- test log tail ---"
            tail -80 "$RUNNER_TEMP/unit-test.log"
          fi

      - name: Build release APK
        env:
          PHOCID_KEYSTORE_PASSWORD: ${{ secrets.PHOCID_KEYSTORE_PASSWORD }}
          PHOCID_KEY_ALIAS: ${{ secrets.PHOCID_KEY_ALIAS }}
          PHOCID_KEY_PASSWORD: ${{ secrets.PHOCID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "=== $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Publish release APK (overwrite)
        uses: ncipollo/release-action@v1
        with:
          tag: phocid-next-latest
          name: Phocid Next - Latest
          body: |
            **Latest Phocid Next build**

            - Package: `org.sunsetware.phocid.next`
            - Commit: `${{ github.sha }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Old APKs in this release are replaced on every build.
          artifacts: app/build/outputs/apk/release/*.apk
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
