name: Android Build

on:
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: Run JVM unit tests
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The build job itself only needs to read the repository; the write token is granted
# per-step to the release publishing steps only.
permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          # The tag move below pushes with an explicitly scoped step token instead of a
          # persisted repo-wide credential.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: false

      - name: Prepare signing keystore
        env:
          PHOCID_KEYSTORE_BASE64: ${{ secrets.PHOCID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${PHOCID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$PHOCID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/phocid-signing.p12"
            echo "PHOCID_KEYSTORE_PATH=$RUNNER_TEMP/phocid-signing.p12" >> "$GITHUB_ENV"
            echo "Using stable signing keystore from PHOCID_KEYSTORE_BASE64"
          else
            echo "PHOCID_KEYSTORE_BASE64 is not set; release builds will be unsigned (PR verification only)."
          fi

      - name: Validate stable release signing
        if: github.ref == 'refs/heads/main'
        env:
          PHOCID_KEYSTORE_PASSWORD: ${{ secrets.PHOCID_KEYSTORE_PASSWORD }}
          PHOCID_KEY_ALIAS: ${{ secrets.PHOCID_KEY_ALIAS }}
          PHOCID_KEY_PASSWORD: ${{ secrets.PHOCID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ -n "${PHOCID_KEYSTORE_PATH:-}" ] ||
            fail "PHOCID_KEYSTORE_PATH is not set; main releases require PHOCID_KEYSTORE_BASE64 to be configured"
          [ -f "$PHOCID_KEYSTORE_PATH" ] ||
            fail "PHOCID_KEYSTORE_PATH does not point to a regular file: $PHOCID_KEYSTORE_PATH"
          [ -r "$PHOCID_KEYSTORE_PATH" ] ||
            fail "PHOCID_KEYSTORE_PATH is not readable: $PHOCID_KEYSTORE_PATH"

          # Match the defaults in app/build.gradle.kts. The old release workflow used
          # these defaults when the individual password/alias secrets were absent;
          # validating the effective values avoids both a false failure and a false
          # stable-signing claim.
          storepass="${PHOCID_KEYSTORE_PASSWORD:-android}"
          alias="${PHOCID_KEY_ALIAS:-androiddebugkey}"
          keypass="${PHOCID_KEY_PASSWORD:-android}"
          [ -n "$alias" ] || fail "PHOCID_KEY_ALIAS is empty"

          # Do not echo the password or keytool output: they can contain credential details.
          if ! keytool -list -keystore "$PHOCID_KEYSTORE_PATH" \
              -storetype PKCS12 \
              -storepass "$storepass" \
              -alias "$alias" > /dev/null 2>&1; then
            fail "Unable to open keystore with keytool or alias '$alias' is missing"
          fi
          if ! keytool -certreq -keystore "$PHOCID_KEYSTORE_PATH" \
              -storetype PKCS12 \
              -storepass "$storepass" \
              -alias "$alias" \
              -keypass "$keypass" > /dev/null 2>&1; then
            fail "Unable to use the private key for alias '$alias'"
          fi

          echo "Stable release signing keystore validated for alias '$alias'."

      - name: Run unit tests
        id: unit_tests
        # The Gradle test tasks are themselves bounded (15 min each); this step bound keeps a
        # pathological hang from consuming the whole 45-minute job budget.
        timeout-minutes: 30
        if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_unit_tests == true)
        env:
          PHOCID_KEYSTORE_PASSWORD: ${{ secrets.PHOCID_KEYSTORE_PASSWORD }}
          PHOCID_KEY_ALIAS: ${{ secrets.PHOCID_KEY_ALIAS }}
          PHOCID_KEY_PASSWORD: ${{ secrets.PHOCID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          # setup-gradle restores caches across commits; a restored cache can carry a stale
          # "module absent" marker (e.g. a BOM a new AGP pulls in that was not yet published when
          # the cache was written), failing configuration even though the artifact now exists.
          # Refresh dependency metadata so absence is re-checked against the repositories.
          ./gradlew --no-daemon --stacktrace --console=plain --refresh-dependencies :app:customSetup :app:testDebugUnitTest :agent-bridge:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/unit-test.log"
          status=${PIPESTATUS[0]}
          exit $status

      - name: Pinpoint where the unit tests stalled
        # A test that never returns leaves no failing test to report, so surface the last
        # test activity as an annotation: that names the class and method that stalled.
        # Only when the test step did not succeed: 'failure' covers failed tests and
        # 'cancelled' covers the step timeout (a hang). Green or skipped runs must not
        # emit an ::error:: annotation.
        if: always() && steps.unit_tests.outcome != 'success' && steps.unit_tests.outcome != 'skipped'
        run: |
          LOG="$RUNNER_TEMP/unit-test.log"
          [ -f "$LOG" ] || exit 0
          LAST=$(grep -E ' (STARTED|FAILED|SKIPPED)$' "$LOG" | tail -6 | tr '\n' ';' | sed 's/;*$//')
          MODULE=$(grep -E '^> Task :(app|agent-bridge):test.*UnitTest' "$LOG" | tail -1)
          echo "::error::Last unit-test activity: ${LAST:-none} | ${MODULE:-no test task yet}"

      - name: Upload unit test diagnostics
        # Always: when a test deadlocks or the step times out, this log names the last test
        # that started, which is the only record of where the run stalled.
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-test-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/unit-test.log
            app/build/reports/tests/
            agent-bridge/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

      - name: Report unit test failures
        if: failure() && steps.unit_tests.outcome == 'failure'
        run: |
          # The console log truncates test failure messages; the JUnit XML has them verbatim, and
          # the annotation budget is small, so report those first.
          for report in app/build/test-results/testDebugUnitTest/*.xml agent-bridge/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$report" ] || continue
            grep -o '<failure[^>]*message="[^"]*"' "$report" | head -5 | while IFS= read -r line; do
              echo "::error::${report}: ${line}"
            done
          done
          if [ -f "$RUNNER_TEMP/unit-test.log" ]; then
            grep -nE "(^e: | error: |FAILED|> Task .* FAILED|AssertionError|expected:|but was:)" "$RUNNER_TEMP/unit-test.log" | head -5 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -n -A16 -B2 -E "What went wrong|Could not resolve|Failed to apply plugin|requires Gradle" "$RUNNER_TEMP/unit-test.log" | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "--- test log tail ---"
            tail -80 "$RUNNER_TEMP/unit-test.log"
          fi

      - name: Upload unit test reports
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            agent-bridge/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Scan deprecated storage APIs
        run: |
          chmod +x scripts/scan-deprecated-storage.sh
          ./scripts/scan-deprecated-storage.sh --check

      - name: Check Kotlin formatting
        # The tree has had its ktfmt pass; formatting now gates builds. Run ./gradlew ktfmtFormat
        # locally to fix any drift before pushing.
        run: |
          ./gradlew --no-daemon --stacktrace --console=plain :app:ktfmtCheck :agent-bridge:ktfmtCheck

      - name: Run Android Lint
        run: |
          # Lint/AGP analysis needs more heap than the local/unit-test cap.
          ./gradlew --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8' \
            :app:lintDebug :agent-bridge:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            agent-bridge/build/reports/lint-results-debug.html
            agent-bridge/build/reports/lint-results-debug.xml
          if-no-files-found: warn

      - name: Build release APK
        env:
          PHOCID_KEYSTORE_PASSWORD: ${{ secrets.PHOCID_KEYSTORE_PASSWORD }}
          PHOCID_KEY_ALIAS: ${{ secrets.PHOCID_KEY_ALIAS }}
          PHOCID_KEY_PASSWORD: ${{ secrets.PHOCID_KEY_PASSWORD }}
          PHOCID_BUILD_COMMIT: ${{ github.sha }}
          # Monotonically increasing per workflow so versionCode always grows.
          PHOCID_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Derive the build label from the commit, not wall-clock time: the same commit must
          # produce byte-identical BuildConfig values (and therefore reproducible APKs).
          export PHOCID_BUILD_TIME="$(git log -1 --format=%cI HEAD)"
          # R8 needs more heap than the local/unit-test cap in gradle.properties.
          ./gradlew --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8' \
            :app:assembleRelease :agent-bridge:assembleRelease

      - name: Verify APK signatures
        # PR builds are intentionally unsigned (the signing keystore is a secret); only the
        # keystore-backed builds - which are the distributable ones - verify certificates.
        if: env.PHOCID_KEYSTORE_PATH != ''
        env:
          PHOCID_CERT_SHA256: ${{ secrets.PHOCID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          [ -x "$APKSIGNER" ] || { echo "::error::apksigner not found at $APKSIGNER"; exit 1; }

          shopt -s nullglob
          app_apks=(app/build/outputs/apk/release/*.apk)
          bridge_apks=(agent-bridge/build/outputs/apk/release/*.apk)
          [ "${#app_apks[@]}" -gt 0 ] || { echo "::error::No app release APK was built"; exit 1; }
          [ "${#bridge_apks[@]}" -gt 0 ] || { echo "::error::No agent-bridge release APK was built"; exit 1; }

          cert_sha256() {
            "$APKSIGNER" verify --print-certs "$1" |
              awk -F': ' '/Signer #1 certificate SHA-256 digest/ { print tolower($2) }'
          }

          for apk in "${app_apks[@]}" "${bridge_apks[@]}"; do
            echo "=== $apk"
            "$APKSIGNER" verify --print-certs "$apk" |
              grep -E "Signer #1 certificate (DN|SHA-256 digest):"
          done

          app_digest="$(cert_sha256 "${app_apks[0]}")"
          [ -n "$app_digest" ] || { echo "::error::Unable to read the app APK signer certificate"; exit 1; }

          for apk in "${app_apks[@]}" "${bridge_apks[@]}"; do
            digest="$(cert_sha256 "$apk")"
            [ -n "$digest" ] || { echo "::error::Unable to read the signer certificate from $apk"; exit 1; }
            if [ "$digest" != "$app_digest" ]; then
              echo "::error::$apk is signed by a different certificate than the app APK"
              exit 1
            fi
          done
          echo "App and agent-bridge APKs share signer certificate SHA-256: $app_digest"

          if [ "${GITHUB_REF:-}" = "refs/heads/main" ] && [ -n "${PHOCID_CERT_SHA256:-}" ]; then
            expected="$(printf '%s' "$PHOCID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:')"
            if [ "$app_digest" != "$expected" ]; then
              echo "::error::App APK signer certificate does not match PHOCID_CERT_SHA256"
              exit 1
            fi
            echo "App APK signer certificate matches PHOCID_CERT_SHA256."
          fi

      - name: Verify AppFunctions artifacts in release APK
        run: |
          set -euo pipefail
          # The manifest references the KSP-generated PhocidAppFunctionService and two
          # asset files. None of those are checked by the build (the service class only
          # materialises at runtime), so assert them here: a compiler or annotation
          # regression must fail CI instead of shipping a broken AppFunctions surface.
          # Release APKs are either signed (keystore-backed builds) or unsigned (PR
          # verification); both names must work here.
          shopt -s nullglob
          apk_candidates=(app/build/outputs/apk/release/*.apk)
          [ "${#apk_candidates[@]}" -gt 0 ] || { echo "::error::No app release APK was built"; exit 1; }
          apk="${apk_candidates[0]}"
          unzip -l "$apk" | grep -q "assets/phocid_app_functions.xml" ||
            { echo "::error::KSP-generated assets/phocid_app_functions.xml missing from $apk"; exit 1; }
          unzip -l "$apk" | grep -q "assets/app_functions_schema.xsd" ||
            { echo "::error::assets/app_functions_schema.xsd missing from $apk"; exit 1; }
          unzip -p "$apk" 'classes*.dex' |
            grep -a -q "org/sunsetware/phocid/appfunctions/PhocidAppFunctionService" ||
            { echo "::error::Generated PhocidAppFunctionService class missing from $apk"; exit 1; }
          echo "AppFunctions service class and schema assets verified in release APK."

      # Non-main builds are verification only: their release APKs are unsigned and are NOT
      # uploaded as distributable artifacts. A debug-signed artifact would let anyone holding
      # that keystore forge a same-signature companion against AGENT_QUERY.

      - name: Stage and upload signed release APKs (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cp agent-bridge/build/outputs/apk/release/*.apk dist/
      - name: Upload signed release APKs (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-apks
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  # Publishing needs a write token, so it is a separate job with its own narrow grant; the
  # build job - and every PR run - only ever sees a read token. (Step-level permissions are
  # not valid in GitHub Actions; this job split is the supported way to narrow the token.)
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The tag move pushes with an explicitly scoped step token instead of a
          # persisted repo-wide credential.
          persist-credentials: false

      - name: Download signed release APKs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-apks
          path: dist

      - name: Publish release APK (overwrite)
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: phocid-next-latest
          commit: ${{ github.sha }}
          name: Phocid Next - Latest
          body: |
            **Latest Phocid Next build**

            - Main package: `org.sunsetware.phocid.next`
            - Agent bridge package: `org.sunsetware.phocid.bridge`
            - Commit: `${{ github.sha }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Old APKs in this release are replaced on every build.
          artifacts: |
            dist/app-release.apk
            dist/agent-bridge-release.apk
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move release tag to this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag --force phocid-next-latest "$GITHUB_SHA"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/phocid-next-latest"
