name: Android Build

on:
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: Run JVM unit tests
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Prepare signing keystore
        env:
          PHOCID_KEYSTORE_BASE64: ${{ secrets.PHOCID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${PHOCID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$PHOCID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/phocid-signing.p12"
            echo "PHOCID_KEYSTORE_PATH=$RUNNER_TEMP/phocid-signing.p12" >> "$GITHUB_ENV"
            echo "Using stable signing keystore from PHOCID_KEYSTORE_BASE64"
          else
            echo "PHOCID_KEYSTORE_BASE64 is not set; AGP will generate a per-run debug keystore."
          fi

      - name: Validate stable release signing
        if: github.ref == 'refs/heads/main'
        env:
          PHOCID_KEYSTORE_PASSWORD: ${{ secrets.PHOCID_KEYSTORE_PASSWORD }}
          PHOCID_KEY_ALIAS: ${{ secrets.PHOCID_KEY_ALIAS }}
          PHOCID_KEY_PASSWORD: ${{ secrets.PHOCID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ -n "${PHOCID_KEYSTORE_PATH:-}" ] ||
            fail "PHOCID_KEYSTORE_PATH is not set; main releases require PHOCID_KEYSTORE_BASE64 to be configured"
          [ -f "$PHOCID_KEYSTORE_PATH" ] ||
            fail "PHOCID_KEYSTORE_PATH does not point to a regular file: $PHOCID_KEYSTORE_PATH"
          [ -r "$PHOCID_KEYSTORE_PATH" ] ||
            fail "PHOCID_KEYSTORE_PATH is not readable: $PHOCID_KEYSTORE_PATH"
          [ -n "${PHOCID_KEYSTORE_PASSWORD:-}" ] || fail "PHOCID_KEYSTORE_PASSWORD is empty"
          [ -n "${PHOCID_KEY_ALIAS:-}" ] || fail "PHOCID_KEY_ALIAS is empty"
          [ -n "${PHOCID_KEY_PASSWORD:-}" ] || fail "PHOCID_KEY_PASSWORD is empty"

          # Do not echo the password or keytool output: they can contain credential details.
          if ! keytool -list -keystore "$PHOCID_KEYSTORE_PATH" \
              -storetype PKCS12 \
              -storepass "$PHOCID_KEYSTORE_PASSWORD" \
              -alias "$PHOCID_KEY_ALIAS" > /dev/null 2>&1; then
            fail "Unable to open keystore with keytool or alias '$PHOCID_KEY_ALIAS' is missing"
          fi

          echo "Stable release signing keystore validated for alias '$PHOCID_KEY_ALIAS'."

      - name: Run unit tests
        id: unit_tests
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_unit_tests == true)
        env:
          PHOCID_KEYSTORE_PASSWORD: ${{ secrets.PHOCID_KEYSTORE_PASSWORD }}
          PHOCID_KEY_ALIAS: ${{ secrets.PHOCID_KEY_ALIAS }}
          PHOCID_KEY_PASSWORD: ${{ secrets.PHOCID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain :app:customSetup :app:testDebugUnitTest :agent-bridge:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/unit-test.log"
          status=${PIPESTATUS[0]}
          exit $status

      - name: Report unit test failures
        if: failure() && steps.unit_tests.outcome == 'failure'
        run: |
          if [ -f "$RUNNER_TEMP/unit-test.log" ]; then
            grep -nE "(^e: | error: |FAILED|> Task .* FAILED|AssertionError|expected:|but was:)" "$RUNNER_TEMP/unit-test.log" | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -n -A16 -B2 -E "What went wrong|Could not resolve|Failed to apply plugin|requires Gradle" "$RUNNER_TEMP/unit-test.log" | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "--- test log tail ---"
            tail -80 "$RUNNER_TEMP/unit-test.log"
          fi

      - name: Upload unit test reports
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            agent-bridge/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Scan deprecated storage APIs
        run: |
          chmod +x scripts/scan-deprecated-storage.sh
          ./scripts/scan-deprecated-storage.sh --check

      - name: Run Android Lint
        run: |
          ./gradlew --no-daemon --stacktrace :app:lintDebug :agent-bridge:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            agent-bridge/build/reports/lint-results-debug.html
            agent-bridge/build/reports/lint-results-debug.xml
          if-no-files-found: warn

      - name: Build release APK
        env:
          PHOCID_KEYSTORE_PASSWORD: ${{ secrets.PHOCID_KEYSTORE_PASSWORD }}
          PHOCID_KEY_ALIAS: ${{ secrets.PHOCID_KEY_ALIAS }}
          PHOCID_KEY_PASSWORD: ${{ secrets.PHOCID_KEY_PASSWORD }}
          PHOCID_BUILD_COMMIT: ${{ github.sha }}
        run: |
          export PHOCID_BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          # R8 needs more heap than the local/unit-test cap in gradle.properties.
          ./gradlew --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8' \
            :app:assembleRelease :agent-bridge:assembleRelease

      - name: Verify APK signatures
        env:
          PHOCID_CERT_SHA256: ${{ secrets.PHOCID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          [ -x "$APKSIGNER" ] || { echo "::error::apksigner not found at $APKSIGNER"; exit 1; }

          shopt -s nullglob
          app_apks=(app/build/outputs/apk/release/*.apk)
          bridge_apks=(agent-bridge/build/outputs/apk/release/*.apk)
          [ "${#app_apks[@]}" -gt 0 ] || { echo "::error::No app release APK was built"; exit 1; }
          [ "${#bridge_apks[@]}" -gt 0 ] || { echo "::error::No agent-bridge release APK was built"; exit 1; }

          cert_sha256() {
            "$APKSIGNER" verify --print-certs "$1" |
              awk -F': ' '/Signer #1 certificate SHA-256 digest/ { print tolower($2) }'
          }

          for apk in "${app_apks[@]}" "${bridge_apks[@]}"; do
            echo "=== $apk"
            "$APKSIGNER" verify --print-certs "$apk" |
              grep -E "Signer #1 certificate (DN|SHA-256 digest):"
          done

          app_digest="$(cert_sha256 "${app_apks[0]}")"
          [ -n "$app_digest" ] || { echo "::error::Unable to read the app APK signer certificate"; exit 1; }

          for apk in "${app_apks[@]}" "${bridge_apks[@]}"; do
            digest="$(cert_sha256 "$apk")"
            [ -n "$digest" ] || { echo "::error::Unable to read the signer certificate from $apk"; exit 1; }
            if [ "$digest" != "$app_digest" ]; then
              echo "::error::$apk is signed by a different certificate than the app APK"
              exit 1
            fi
          done
          echo "App and agent-bridge APKs share signer certificate SHA-256: $app_digest"

          if [ "${GITHUB_REF:-}" = "refs/heads/main" ] && [ -n "${PHOCID_CERT_SHA256:-}" ]; then
            expected="$(printf '%s' "$PHOCID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:')"
            if [ "$app_digest" != "$expected" ]; then
              echo "::error::App APK signer certificate does not match PHOCID_CERT_SHA256"
              exit 1
            fi
            echo "App APK signer certificate matches PHOCID_CERT_SHA256."
          fi

      - name: Upload test APKs (debug-signed, non-main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: test-debug-signed-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            agent-bridge/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release APK (overwrite)
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: phocid-next-latest
          commit: ${{ github.sha }}
          name: Phocid Next - Latest
          body: |
            **Latest Phocid Next build**

            - Main package: `org.sunsetware.phocid.next`
            - Agent bridge package: `org.sunsetware.phocid.bridge`
            - Commit: `${{ github.sha }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Old APKs in this release are replaced on every build.
          artifacts: |
            app/build/outputs/apk/release/*.apk
            agent-bridge/build/outputs/apk/release/*.apk
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move release tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag --force phocid-next-latest "$GITHUB_SHA"
          git push --force origin "refs/tags/phocid-next-latest"
